<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siden blev ikke fundet | Farve X-perten</title>
<meta name="robots" content="noindex">
<link href="assets/fonts/fonts.css" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<style>
:root{--accent:#FB8D0D;--accent-dark:#e57d05;--dark:#26404C;--dark-2:#375D6E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;text-align:center;
  color:#fff;background:linear-gradient(150deg,var(--dark),var(--dark-2));padding:24px}
.wrap{max-width:520px}
img{height:52px;margin:0 auto 32px}
h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(3rem,10vw,5rem);color:var(--accent);letter-spacing:-.02em}
h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.5rem;margin:6px 0 14px}
p{color:rgba(255,255,255,.85);font-weight:300;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif;font-weight:600;
  background:var(--accent);color:var(--dark);padding:15px 28px;border-radius:10px;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--accent-dark)}
</style>
</head>
<body>
<div class="wrap">
  <img src="assets/img/farvexperten-logo.png" alt="Farve X-perten">
  <h1>404</h1>
  <h2>Siden blev ikke fundet</h2>
  <p>Vi kunne ikke finde den side, du leder efter. Måske er den flyttet eller fjernet.</p>
  <a href="index.html" class="btn">Tilbage til forsiden</a>
</div>
</body>
</html>
